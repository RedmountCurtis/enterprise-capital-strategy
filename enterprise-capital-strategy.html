<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redmount Enterprise Capital Strategy</title>
<style>
  :root{
    --navy:#002347; --navy-2:#01315f; --cobalt:#2f6fed; --cobalt-dim:#5b8bf0;
    --paper:#f6f7fa; --card:#ffffff; --line:#e2e6ee; --ink:#0e1a2b; --ink-dim:#5b6b82;
    --good:#177350; --good-bg:#e7f5ee; --warn:#8a5a00; --warn-bg:#fff3de;
    --bad:#9c2b2b; --bad-bg:#fbe9e9; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink);}
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:250px; flex-shrink:0; background:var(--navy); color:#cfe0ff; padding:22px 18px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{font-size:15px; font-weight:700; color:#fff;}
  .brand small{display:block; font-weight:400; color:#9fb8e6; font-size:11px; margin-top:2px;}
  .client-list{display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
  .client-item{padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:#b7c9e8; display:flex; justify-content:space-between; align-items:center;}
  .client-item:hover{color:#fff;}
  .client-item.active{background:var(--navy-2); color:#fff; font-weight:600;}
  .client-item .gapdot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .side-foot{margin-top:auto; font-size:11px; color:#7d92b8; line-height:1.5;}
  .tool-switcher-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#7d92b8; font-weight:600; margin-bottom:6px;}
  .tool-switcher{width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-family:inherit; font-size:12.5px; padding:8px 9px; border-radius:6px;}
  .tool-switcher option{color:#111;}
  .nav-divider{height:1px; background:rgba(255,255,255,0.12); margin:4px 0;}
  .main{flex:1; padding:32px 40px; max-width:1220px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--ink-dim); font-size:13.5px; margin:0 0 22px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:22px;}
  .panel h2{font-size:15px; margin:0 0 4px;}
  .panel .desc{color:var(--ink-dim); font-size:12.5px; margin:0 0 16px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px; flex:1; min-width:190px;}
  .field label{font-size:11px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em;}
  input, select, textarea{border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink); width:100%;}
  input[type="radio"], input[type="checkbox"]{width:auto; border:none; padding:0; background:none; border-radius:0; accent-color:var(--cobalt); flex-shrink:0;}
  input[type="range"]{padding:0; accent-color:var(--cobalt);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--cobalt-dim); outline-offset:0; border-color:var(--cobalt);}
  .btn{background:var(--cobalt); color:#fff; border:none; border-radius:7px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn:hover{background:#2660d4;}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--line);}
  .btn.secondary:hover{background:#f0f3f8;}
  .btn.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line); padding:6px 10px; font-size:12px;}
  .btn.ghost:hover{background:#f0f3f8; color:var(--navy);}
  .btn.danger{background:transparent; color:var(--bad); border:1px solid #efc6c6; padding:6px 10px; font-size:12px;}
  .btn.danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line); overflow-x:auto;}
  .tab{padding:10px 14px; font-size:13px; font-weight:600; color:var(--ink-dim); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--cobalt); border-color:var(--cobalt);}
  .subhead{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--navy); margin:20px 0 10px;}
  .subhead:first-child{margin-top:0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:8px 10px; font-weight:600;}
  td{padding:8px 10px; border-bottom:1px solid #eef1f6; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty{border:1px dashed var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--ink-dim); font-size:13px;}
  .gauge-wrap{display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start;}
  .bar-track{height:10px; background:#eef1f6; border-radius:99px; margin:8px 0; position:relative; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#2f6fed,#7aa5f5);}
  .gap-flag{display:inline-block; margin-top:10px; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700;}
  .gap-flag.aligned{background:var(--good-bg); color:var(--good);}
  .gap-flag.over{background:var(--bad-bg); color:var(--bad);}
  .gap-flag.under{background:var(--warn-bg); color:var(--warn);}
  .summary-cards{display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .scard{flex:1; min-width:150px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .scard .label{font-size:11px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.03em;}
  .scard .value{font-size:26px; font-weight:800; margin-top:4px; color:var(--navy);}
  .scard.warn .value{color:var(--warn);}
  .scard.bad .value{color:var(--bad);}
  .scard.good .value{color:var(--good);}
  .divider{height:1px; background:var(--line); margin:18px 0;}
  .flag{padding:2px 9px; border-radius:6px; font-size:11px; font-weight:600; display:inline-block; background:#eef1f6; color:var(--ink-dim);}
  .flag.ok{background:var(--good-bg); color:var(--good);}
  .flag.err{background:var(--bad-bg); color:var(--bad);}
  .flag.warn{background:var(--warn-bg); color:var(--warn);}
  .compact{font-size:12.5px !important; padding:5px 8px !important;}
  .signout-link{color:#b7c9e8;}
  .signout-link:hover{color:#fff;}
  .note{background:var(--warn-bg); border:1px solid #f0dcaa; color:#6b4a00; border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:18px;}
  .note strong{color:#3d2c00;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  footer.tool-foot{font-size:11.5px; color:var(--ink-dim); margin-top:6px; text-align:right;}
  .rowline{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .rowline .grow{flex:1;}
  .removeX{background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; line-height:1; padding:4px;}
  .removeX:hover{color:var(--bad);}
  .addRowBtn{font-size:12.5px; font-weight:600; color:var(--cobalt); background:none; border:1px dashed var(--cobalt-dim); border-radius:7px; padding:7px 12px; cursor:pointer; margin-top:4px;}
  .addRowBtn:hover{background:#f5f8ff;}

  /* Probability of success gauge */
  .pos-meter{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .pos-num{font-size:48px; font-weight:800;}
  .pos-num.good{color:var(--good);} .pos-num.warn{color:var(--warn);} .pos-num.bad{color:var(--bad);}
  .pos-label{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:700; margin-top:2px;}
  .pos-track{height:16px; background:#eef1f6; border-radius:99px; overflow:hidden; flex:1; min-width:220px;}
  .pos-fill{height:100%; border-radius:99px; transition:width .3s;}

  /* What-if sliders */
  .slider-row{margin-bottom:18px;}
  .slider-row .sr-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .slider-row .sr-head .sr-val{color:var(--cobalt); font-weight:700;}

  .authgate{position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px;}
  .authcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:380px; padding:32px 32px 26px; box-shadow:0 8px 24px -12px rgba(0,35,71,0.18);}
  .authcard .auth-logo{font-size:15px; font-weight:800; color:var(--navy); letter-spacing:.02em; margin-bottom:6px;}
  .authcard h1{font-size:21px; margin:14px 0 4px; color:var(--navy);}
  .authcard p.sub{font-size:12.5px; color:var(--ink-dim); margin:0 0 22px;}
  .authcard label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin:16px 0 5px;}
  .authcard input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; font-family:inherit; box-sizing:border-box;}
  .authcard input:focus{outline:none; border-color:var(--cobalt);}
  .authcard button{width:100%; margin-top:20px; padding:11px; background:var(--cobalt); border:none; color:#fff; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;}
  .authcard button:disabled{opacity:.6; cursor:not-allowed;}
  .authcard .err{font-size:12.5px; color:var(--bad); margin-top:10px; display:none;}
  .authcard .err.show{display:block;}
  .sync-status{font-size:10.5px; color:#7d92b8; margin-top:4px; display:flex; align-items:center; gap:5px;}
  .sync-dot{width:6px; height:6px; border-radius:50%; background:#7d92b8; flex-shrink:0;}
  .sync-dot.saved{background:#3ecf8e;}
  .sync-dot.saving{background:#e0a83f;}
  .sync-dot.error{background:#e06767;}

  /* Print / PDF layout */
  #printArea{display:none;}
  .pdf-letterhead{margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid var(--navy);}
  .pdf-letterhead .firm{font-size:18px; font-weight:800; color:var(--navy); letter-spacing:.02em;}
  .pdf-letterhead .addr{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .pdf-title{font-size:15px; font-weight:700; color:var(--navy); margin:18px 0 2px;}
  .pdf-sub{font-size:11.5px; color:var(--ink-dim); margin-bottom:10px;}
  .pdf-section{margin-top:16px;}
  .pdf-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:4px; margin:0 0 8px;}
  .pdf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 18px; font-size:12px;}
  .pdf-grid.two{grid-template-columns:repeat(2,1fr);}
  .pdf-field{display:flex; flex-direction:column;}
  .pdf-field .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim);}
  .pdf-field .v{font-size:12px; color:var(--ink); border-bottom:1px solid #eee; padding:1px 0 3px; min-height:15px;}
  .pdf-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px;}
  .pdf-table th{text-align:left; font-size:9.5px; text-transform:uppercase; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:5px 6px;}
  .pdf-table td{padding:5px 6px; border-bottom:1px solid #f0f0f0;}
  .pdf-scores{display:flex; gap:30px; margin:10px 0;}
  .pdf-scores .s{text-align:center;}
  .pdf-scores .s .num{font-size:26px; font-weight:800; color:var(--navy);}
  .pdf-scores .s .lbl{font-size:9.5px; text-transform:uppercase; color:var(--ink-dim);}
  .pdf-sig-row{display:flex; gap:40px; margin-top:34px;}
  .pdf-page-break{page-break-before:always;}
  .pdf-sig{flex:1; border-top:1px solid #999; padding-top:5px; font-size:10.5px; color:var(--ink-dim);}
  .pdf-notes{font-size:12px; white-space:pre-wrap; border:1px solid var(--line); border-radius:4px; padding:8px; min-height:30px;}

  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; padding:14px 16px; gap:10px; position:static; height:auto; overflow-y:visible;}
    .sidebar .brand{width:100%;}
    .sidebar input, .sidebar select, .sidebar .btn{width:auto; flex:1; min-width:110px;}
    .client-list{width:100%; max-height:140px; overflow-y:auto; order:5;}
    .tool-switcher-label, .tool-switcher, .nav-divider, .side-foot{width:100%;}
    .main{padding:18px 16px;}
    .row{flex-direction:column;}
    .tabs{flex-wrap:nowrap;}
    table{font-size:12px;}
  }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; left:0; top:0; width:100%; padding:20px;}
    @page{margin:0.6in;}
  }
</style>
</head>
<body>
<div class="authgate" id="authGate">
  <div class="authcard">
    <div class="auth-logo">REDMOUNT</div>
    <h1>Enterprise Capital Strategy</h1>
    <p class="sub">Sign in to access client data.</p>
    <label>Email</label>
    <input type="email" id="authEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button id="authSubmit">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>
<div id="mainApp" style="display:none;">
<div class="shell">
  <aside class="sidebar">
    <div class="brand">REDMOUNT<small>Enterprise Capital Strategy</small></div>
    <button class="btn" onclick="addClient()">+ New Client</button>
    <input type="text" placeholder="Search clients…" oninput="setClientSearch(this.value)"
      style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-size:12.5px; padding:7px 9px; border-radius:6px;">
    <select id="clientDropdown" onchange="if(this.value) selectClient(this.value);"
      style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-size:12.5px; padding:7px 9px; border-radius:6px; font-family:inherit;">
      <option value="">Jump to client…</option>
    </select>
    <div class="client-list" id="clientList"></div>
    <div class="side-foot">
      Signed in as <span id="authedEmail"></span> · <span class="signout-link" id="signOutBtn" style="cursor:pointer; text-decoration:underline;">Sign out</span>
      <div class="sync-status" id="syncStatus"><span class="sync-dot" id="syncDot"></span><span id="syncText">Idle</span></div>
      <div style="margin-top:6px; color:#5b7bab;">Client roster is shared with Risk Modeling — clients added here appear there too, and vice versa.</div>
    </div>

    <div class="nav-divider"></div>
    <div class="tool-switcher-label">Switch Tool</div>
    <select class="tool-switcher" id="toolSwitcher">
      <option value="">— Redmount Tools —</option>
      <option value="https://redmountcurtis.github.io/Redmount-Terminal/">Terminal (Home)</option>
      <option value="https://redmountcurtis.github.io/401k/">Fiduciary Monitor</option>
      <option value="https://redmountcurtis.github.io/capital-stack-navigator/">Capital Stack Navigator</option>
      <option value="https://redmountcurtis.github.io/risk-modeling/">Risk Modeling</option>
      <option value="https://redmountcurtis.github.io/financial-plan/">Financial Plan</option>
      <option value="https://redmountcurtis.github.io/enterprise-capital-strategy/" selected disabled>Enterprise Capital Strategy (current)</option>
    </select>
  </aside>

  <main class="main" id="mainArea">
    <div class="empty" style="margin-top:60px;">Add a client to get started.</div>
  </main>
</div>
</div>
<div id="printArea"></div>

<script>
// ==================== AUTH + PERSISTENCE ====================
const SUPABASE_URL = 'https://pdympbpyavilstjsmjtm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2CogNhXWXa7phJfFPpxVgg_JEevv89Y';
const AUTH_URL = SUPABASE_URL + '/auth/v1';
const REST_URL = SUPABASE_URL + '/rest/v1';
const SESSION_KEY = 'redmount_session'; // shared across all Redmount tools for single sign-on

function $id(id){ return document.getElementById(id); }

async function authSignIn(email, password){
  const res = await fetch(AUTH_URL+'/token?grant_type=password', {
    method:'POST', headers:{'apikey':SUPABASE_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
  return data;
}
async function authRefresh(refreshToken){
  const res = await fetch(AUTH_URL+'/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':SUPABASE_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token:refreshToken})
  });
  const data = await res.json();
  if(!res.ok) throw new Error('refresh failed');
  return data;
}
function saveSession(data){
  const session = {access_token:data.access_token, refresh_token:data.refresh_token,
    expires_at: Date.now() + (data.expires_in||3600)*1000, email: data.user && data.user.email};
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  return session;
}
function loadStoredSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function ensureValidSession(){
  const session = loadStoredSession();
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{ const fresh = saveSession(await authRefresh(session.refresh_token)); return fresh; }
  catch(e){ clearSession(); return null; }
}

async function supabaseFetch(path, options){
  options = options || {};
  const session = await ensureValidSession();
  if(!session) throw new Error('Not signed in');
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(REST_URL + path, Object.assign({}, options, {headers}));
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Supabase error ' + res.status + ': ' + text);
  }
  return res;
}

function setSyncStatus(state, text){
  const dot = $id('syncDot'), label = $id('syncText');
  if(!dot) return;
  dot.className = 'sync-dot' + (state ? ' '+state : '');
  label.textContent = text || (state==='saved' ? 'Saved' : state==='saving' ? 'Saving…' : state==='error' ? 'Error saving' : 'Idle');
}

function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,10); }
function esc(v){ return (v===null||v===undefined||v==='') ? '<span style="color:#bbb;">—</span>' : String(v); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt$(v, digits){ digits = digits===undefined?0:digits; return '$'+num(v).toLocaleString(undefined,{minimumFractionDigits:digits, maximumFractionDigits:digits}); }
function fmtPct(v, digits){ digits = digits===undefined?1:digits; return num(v).toFixed(digits)+'%'; }

// ---- Remote load: clients come from the SHARED risk_clients table; this tool's
// own strategy data lives in a separate ecs_plans table keyed by client id. ----
async function loadRemoteData(){
  setSyncStatus('saving', 'Loading…');
  try{
    const [clientsRes, plansRes] = await Promise.all([
      supabaseFetch('/risk_clients?select=id,payload,updated_at&order=updated_at.desc'),
      supabaseFetch('/ecs_plans?select=id,client_id,payload,updated_at')
    ]);
    const clientRows = await clientsRes.json();
    const planRows = await plansRes.json();

    sharedClients = clientRows.map(row => ({
      id: row.id,
      first: (row.payload && row.payload.client1 && row.payload.client1.first) || '',
      last: (row.payload && row.payload.client1 && row.payload.client1.last) || '',
      riskPayload: row.payload || {}
    }));

    plans = {};
    planRemoteIds = {};
    planRows.forEach(row => {
      plans[row.client_id] = migratePlan(row.payload || {});
      planRemoteIds[row.client_id] = row.id;
      lastSavedHash[row.client_id] = JSON.stringify(plans[row.client_id]);
    });
    sharedClients.forEach(sc => { if(!plans[sc.id]) plans[sc.id] = blankPlan(); });

    activeId = sharedClients.length ? sharedClients[0].id : null;
    setSyncStatus('saved', 'Synced');
  }catch(e){
    console.error(e);
    setSyncStatus('error', 'Could not load — using local data');
  }
}

async function savePlanRemote(clientId){
  setSyncStatus('saving');
  try{
    const payload = plans[clientId];
    if(!planRemoteIds[clientId]){
      const res = await supabaseFetch('/ecs_plans', {
        method:'POST',
        headers:{'Prefer':'return=representation'},
        body: JSON.stringify({client_id: clientId, payload})
      });
      const data = await res.json();
      if(data && data[0]) planRemoteIds[clientId] = data[0].id;
    } else {
      await supabaseFetch('/ecs_plans?id=eq.'+planRemoteIds[clientId], {
        method:'PATCH',
        body: JSON.stringify({payload})
      });
    }
    lastSavedHash[clientId] = JSON.stringify(payload);
    setSyncStatus('saved');
  }catch(e){ console.error(e); setSyncStatus('error'); }
}

async function forceSavePlan(clientId){
  const btn = $id('manualSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    await savePlanRemote(clientId);

// ==================== DATA MODEL ====================
let sharedClients = [];
let plans = {};
let planRemoteIds = {};
let activeId = null;
let activeTab = 'balancesheet';
let clientSearchQuery = '';

// Fixed line-item categories matching the Enterprise Capital Strategy report format.
// Each item defaults to a category-appropriate growth rate but every cell is
// individually overridable, since real projections (mortgage paydown schedules,
// planned property acquisitions, business cash extraction plans) rarely follow a
// single flat growth curve.
const ASSET_ITEMS = [
  {key:'personalCash', label:'Cash in Personal Bank Accounts', defaultRate:2},
  {key:'investmentAccounts', label:'Investment Accounts', defaultRate:6},
  {key:'retirementAccounts', label:'Retirement Accounts, 401K and IRA', defaultRate:6},
  {key:'concentratedStock', label:'Concentrated Stock Positions', defaultRate:6},
  {key:'lifeInsuranceOther', label:'Life Insurance, Annuity, Other Financial Assets', defaultRate:3},
  {key:'excessBusinessCash', label:'Excess Cash Balances in Business Accounts', defaultRate:0},
  {key:'residences', label:'Residences', defaultRate:3},
  {key:'investmentProperties', label:'Investment Properties', defaultRate:3},
  {key:'primaryBusiness', label:'Primary Business(es), net of Exc. Cash Balances', defaultRate:5},
  {key:'otherBusinessInterests', label:'Other Business Interests', defaultRate:3},
  {key:'privateEquityDebt', label:'Private Equity & Private Debt Investments', defaultRate:5},
  {key:'otherAssets', label:'Other Assets', defaultRate:0}
];
const LIABILITY_ITEMS = [
  {key:'residenceMortgages', label:'Residences Mortgages', defaultRate:0},
  {key:'loansAgainstPortfolio', label:'Loans Against Investment Portfolio', defaultRate:0},
  {key:'investmentPropertyMortgages', label:'Investment Property Mortgages', defaultRate:0},
  {key:'otherInvestmentPropertyDebt', label:'Other Investment Property Debt', defaultRate:0},
  {key:'primaryBusinessDebt', label:'Primary Business Debt', defaultRate:0},
  {key:'otherBusinessInterestsDebt', label:'Other Business Interests Debt', defaultRate:0},
  {key:'otherLoansPayable', label:'Other Loans Payable', defaultRate:0},
  {key:'loanGuarantees', label:'Loan Guarantees and Contingent Liabilities', defaultRate:0},
  {key:'otherObligations', label:'Other Obligations', defaultRate:0}
];
const PROJECTION_YEARS = 5;

function blankLineItem(defaultRate){
  return { current:'', rate: defaultRate!==undefined ? defaultRate : 0, overrides:{} }; // overrides: {1:val,2:val,...}
}

function blankPlan(){
  const plan = {
    meta: { asOfDate:'', preparedBy:'', pillars: ['Growth Capitalization','Financial Risks','Liquidity','Capital Allocation'] },
    assets: {},
    liabilities: {},
    notes: ''
  };
  ASSET_ITEMS.forEach(it => { plan.assets[it.key] = blankLineItem(it.defaultRate); });
  LIABILITY_ITEMS.forEach(it => { plan.liabilities[it.key] = blankLineItem(it.defaultRate); });
  return plan;
}

function migratePlan(p){
  const b = blankPlan();
  if(p.meta) Object.assign(b.meta, p.meta);
  if(p.notes!==undefined) b.notes = p.notes;
  ASSET_ITEMS.forEach(it=>{ if(p.assets && p.assets[it.key]) b.assets[it.key] = Object.assign(blankLineItem(it.defaultRate), p.assets[it.key]); });
  LIABILITY_ITEMS.forEach(it=>{ if(p.liabilities && p.liabilities[it.key]) b.liabilities[it.key] = Object.assign(blankLineItem(it.defaultRate), p.liabilities[it.key]); });
  return b;
}

function getSharedClient(id){ return sharedClients.find(c=>c.id===id); }
function getPlan(id){ return plans[id]; }
function clientName(sc){ return (sc.first || sc.last) ? `${sc.first} ${sc.last}`.trim() : 'New client'; }

// year: 0 = Current, 1..5 = Year 1..5. Uses the manual override for that year if
// present, otherwise compounds the Current value at the item's growth rate.
function projectedValue(item, year){
  if(year===0) return num(item.current);
  if(item.overrides && item.overrides[year]!==undefined && item.overrides[year]!==''){
    return num(item.overrides[year]);
  }
  return num(item.current) * Math.pow(1 + num(item.rate)/100, year);
}

function yearTotals(plan, year){
  const assets = ASSET_ITEMS.reduce((s,it)=> s + projectedValue(plan.assets[it.key], year), 0);
  const liabilities = LIABILITY_ITEMS.reduce((s,it)=> s + projectedValue(plan.liabilities[it.key], year), 0);
  return { assets, liabilities, net: assets - liabilities };
}

async function addClient(){
  const first = prompt('Client first name?');
  if(first===null) return;
  const last = prompt('Client last name?') || '';
  try{
    const row = await createSharedClient(first.trim(), last.trim());
    if(row){
      sharedClients.unshift({id:row.id, first:first.trim(), last:last.trim(), riskPayload: row.payload || {}});
      plans[row.id] = blankPlan();
      activeId = row.id;
      activeTab = 'balancesheet';
      renderAll();
      forceSavePlan(row.id);
    }
  }catch(e){ console.error(e); alert('Could not create client: ' + e.message); }
}

      `<option value="${sc.id}" ${sc.id===activeId?'selected':''}>${clientName(sc)}</option>`).join('');

  if(filtered.length===0){ wrap.innerHTML = '<div style="font-size:11.5px; color:#7d92b8; padding:6px 10px;">No matches.</div>'; return; }
  wrap.innerHTML = filtered.map(sc=>{
    const plan = getPlan(sc.id);

    if(net!==null){ dotColor = net>0 ? '#3ecf8e' : net<0 ? '#e06767' : '#5b6b82'; }
    return `<div class="client-item ${sc.id===activeId?'active':''}" onclick="selectClient('${sc.id}')">
      <span>${clientName(sc)}</span><span class="gapdot" style="background:${dotColor}"></span>
    </div>`;
  }).join('');
}

// ==================== TAB: BALANCE SHEET PROJECTION ====================
function updateItemField(bucket, key, field, val){
  const plan = getPlan(activeId);
  plan[bucket][key][field] = val;
  renderTab();
}
function updateItemOverride(bucket, key, year, val){
  const plan = getPlan(activeId);
  const item = plan[bucket][key];
  if(val===''){ delete item.overrides[year]; }
  else{ item.overrides[year] = val; }
  renderTab();
}
function clearOverride(bucket, key, year){
  const plan = getPlan(activeId);
  delete plan[bucket][key].overrides[year];
  renderTab();
}

function yearHeaderRow(){
  const years = ['Current'];
  for(let y=1;y<=PROJECTION_YEARS;y++) years.push('Year '+y);
  return years;
}

function lineItemRow(bucket, it, plan, totalsForPct){
  const item = plan[bucket][it.key];
  const cells = [];
  for(let y=0;y<=PROJECTION_YEARS;y++){
    const val = projectedValue(item, y);
    const pctOfAssets = totalsForPct[y] ? (val/totalsForPct[y]*100) : 0;
    if(y===0){
      cells.push(`<td><input class="compact" type="number" style="width:110px;" value="${item.current}" onchange="updateItemField('${bucket}','${it.key}','current',this.value)"></td>`);
    } else {
      const isOverride = item.overrides && item.overrides[y]!==undefined && item.overrides[y]!=='';
      cells.push(`<td>
        <input class="compact" type="number" style="width:110px; ${isOverride?'border-color:var(--cobalt); font-weight:600;':''}"
          value="${isOverride ? item.overrides[y] : Math.round(val)}"
          onchange="updateItemOverride('${bucket}','${it.key}',${y},this.value)"
          title="${isOverride?'Manual override — clear to use the '+item.rate+'% growth formula':'Formula: '+item.rate+'% annual growth'}">
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:1px;">${pctOfAssets.toFixed(1)}%</div>
      </td>`);
    }
  }
  return `<tr>
    <td style="min-width:220px;">${it.label}</td>
    <td><input class="compact" type="number" step="0.5" style="width:64px;" value="${item.rate}" onchange="updateItemField('${bucket}','${it.key}','rate',this.value)" title="Default annual growth rate — used for any year without a manual override"> %</td>
    ${cells.join('')}
  </tr>`;
}

function balanceSheetTabHTML(plan){
  const assetTotalsByYear = [];
  for(let y=0;y<=PROJECTION_YEARS;y++) assetTotalsByYear.push(yearTotals(plan, y).assets);

  const assetRows = ASSET_ITEMS.map(it => lineItemRow('assets', it, plan, assetTotalsByYear)).join('');
  const liabRows = LIABILITY_ITEMS.map(it => lineItemRow('liabilities', it, plan, assetTotalsByYear)).join('');
  const headers = yearHeaderRow();

  const totalRow = (label, fn, cls) => `<tr style="font-weight:700; border-top:2px solid var(--line);">
    <td>${label}</td><td></td>
    ${headers.map((_,y)=>`<td class="${cls||''}">${fmt$(fn(y))}</td>`).join('')}
  </tr>`;

  return `
  <div class="panel">
    <h2>Statement of Current and Projected Balance Sheets</h2>
    <p class="desc">Enter each line item's current value and default annual growth rate. Every projected-year cell is independently editable — click in and type a number to override the formula (e.g. a planned mortgage payoff, a business cash distribution, a property acquisition); clear the cell back to blank to return to the formula.</p>
    <div style="overflow-x:auto;">

      <tbody>
        ${assetRows}
        ${totalRow('Total Assets', y=>yearTotals(plan,y).assets)}
      </tbody>

    </div>
    <div class="divider"></div>
    <div style="overflow-x:auto;">
    <table style="min-width:900px;">
      <thead><tr><th>Liabilities</th><th>Rate</th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>
        ${liabRows}
        ${totalRow('Total Liabilities', y=>yearTotals(plan,y).liabilities)}
        ${totalRow('Net Worth', y=>yearTotals(plan,y).net)}
      </tbody>
    </table>
    </div>

}

// ==================== TAB: CASH TRAJECTORY CHART ====================
function cashTrajectorySVG(plan, w, h){
  w = w||900; h = h||420;
  const padL=90, padR=30, padT=30, padB=50;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const years = [];
  for(let y=0;y<=PROJECTION_YEARS;y++) years.push(y);
  const bizCash = years.map(y=>projectedValue(plan.assets.excessBusinessCash, y));
  const persCash = years.map(y=>projectedValue(plan.assets.personalCash, y));
  const allVals = [...bizCash, ...persCash, 0];
  const maxV = Math.max(...allVals) * 1.12 || 1;
  const minV = Math.min(...allVals, 0) * 1.12;
  const range = maxV - minV || 1;
  const xFor = i => padL + (i/(years.length-1))*plotW;
  const yFor = v => padT + plotH - ((v-minV)/range)*plotH;
  const zeroY = yFor(0);

  const gridLines = [];
  const steps = 5;
  for(let s=0;s<=steps;s++){
    const v = minV + (range*s/steps);
    const yy = yFor(v);
    gridLines.push(`<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#eef1f6" stroke-width="1"/>
      <text x="${padL-10}" y="${yy+4}" font-size="10" fill="#5b6b82" text-anchor="end" font-family="inherit">${fmt$(v)}</text>`);
  }

  function areaPath(vals, baseline){
    let d = `M ${xFor(0)} ${yFor(baseline(0))}`;
    vals.forEach((v,i)=>{ d += ` L ${xFor(i)} ${yFor(v)}`; });
    for(let i=vals.length-1;i>=0;i--){ d += ` L ${xFor(i)} ${yFor(baseline(i))}`; }
    d += ' Z';
    return d;
  }
  const bizArea = areaPath(bizCash, ()=>0);
  const persArea = areaPath(persCash, ()=>0);
  const bizLine = bizCash.map((v,i)=>`${i===0?'M':'L'} ${xFor(i)} ${yFor(v)}`).join(' ');
  const persLine = persCash.map((v,i)=>`${i===0?'M':'L'} ${xFor(i)} ${yFor(v)}`).join(' ');

  const labels = years.map((y,i)=>`<text x="${xFor(i)}" y="${h-padB+20}" font-size="11" fill="var(--ink)" text-anchor="middle" font-family="inherit" font-weight="600">${y===0?'Current':'Year '+y}</text>`);
  const bizDots = bizCash.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.5" fill="#9c2b2b"/><text x="${xFor(i)}" y="${yFor(v)-10}" font-size="10.5" fill="#9c2b2b" text-anchor="middle" font-weight="700" font-family="inherit">${fmt$(v)}</text>`);
  const persDots = persCash.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.5" fill="#2f6fed"/><text x="${xFor(i)}" y="${yFor(v)+18}" font-size="10.5" fill="#2f6fed" text-anchor="middle" font-weight="700" font-family="inherit">${fmt$(v)}</text>`);

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px;">
    ${gridLines.join('')}
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#c7cfdb" stroke-width="1.5"/>
    <path d="${bizArea}" fill="#9c2b2b" opacity="0.16"/>
    <path d="${persArea}" fill="#2f6fed" opacity="0.16"/>
    <path d="${bizLine}" fill="none" stroke="#9c2b2b" stroke-width="2"/>
    <path d="${persLine}" fill="none" stroke="#2f6fed" stroke-width="2"/>
    ${bizDots.join('')}
    ${persDots.join('')}
    ${labels.join('')}
  </svg>`;
}

function chartTabHTML(plan){
  return `
  <div class="panel">

    <p class="desc">Excess Cash Balances in Business Accounts vs. Cash in Personal Bank Accounts, current through Year ${PROJECTION_YEARS} — the core visual for the treasury/liquidity coordination conversation: how planned business cash extraction converts into personal liquid reserves over the plan horizon.</p>

const ECS_PILLARS = [
  {label:'Capital Structuring', desc:'How debt, equity, and owner capital are arranged across the business and personal balance sheet.'},
  {label:'Treasury Management', desc:'Where cash sits, how much is idle, and how it moves between business and personal accounts.'},
  {label:'Cash Flow Management', desc:'The rhythm of income, distributions, and obligations across the household and the business.'},
  {label:'Liquidity & Volatility Coordination', desc:'Matching liquid reserves to the actual volatility of concentrated and illiquid holdings.'},
  {label:'Strategic Asset Allocation', desc:"Positioning investable capital consistent with the owner's full balance sheet, not just the portfolio."},
  {label:'Business Value Enhancement', desc:'Steps that grow enterprise value and de-risk concentration in the primary business.'}
];

function pillarWheelSVG(){
  const cx=210, cy=210, rOuter=195, rInner=70;
  const n = ECS_PILLARS.length;
  const segs = ECS_PILLARS.map((p,i)=>{
    const a0 = (Math.PI*2*i/n) - Math.PI/2, a1 = (Math.PI*2*(i+1)/n) - Math.PI/2;
    const x0=cx+rOuter*Math.cos(a0), y0=cy+rOuter*Math.sin(a0);
    const x1=cx+rOuter*Math.cos(a1), y1=cy+rOuter*Math.sin(a1);
    const ix0=cx+rInner*Math.cos(a0), iy0=cy+rInner*Math.sin(a0);
    const ix1=cx+rInner*Math.cos(a1), iy1=cy+rInner*Math.sin(a1);
    const mid = (a0+a1)/2;
    const labelR = (rOuter+rInner)/2;
    const lx = cx+labelR*Math.cos(mid), ly = cy+labelR*Math.sin(mid);
    const words = p.label.split(' ');
    const lines = [];
    let line = '';
    words.forEach(w=>{ if((line+' '+w).trim().length>12){ lines.push(line.trim()); line=w; } else { line=(line+' '+w).trim(); } });
    if(line) lines.push(line);
    const textLines = lines.map((ln,li)=>`<tspan x="${lx}" dy="${li===0? -(lines.length-1)*6 : 12}">${ln}</tspan>`).join('');
    return `<path d="M ${ix0} ${iy0} L ${x0} ${y0} A ${rOuter} ${rOuter} 0 0 1 ${x1} ${y1} L ${ix1} ${iy1} A ${rInner} ${rInner} 0 0 0 ${ix0} ${iy0} Z"
        fill="${i%2===0?'#002347':'#01315f'}" stroke="#fff" stroke-width="2"/>
      <text font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600" font-family="inherit">${textLines}</text>`;
  }).join('');
  return `<svg width="420" height="420" viewBox="0 0 420 420">${segs}</svg>`;
}

function coverTabHTML(plan){
  return `
  <div class="panel">
    <h2>Strategy Summary</h2>
    <div class="row">
      <div class="field"><label>As-of date</label><input type="date" value="${plan.meta.asOfDate||''}" onchange="update2('meta.asOfDate', this.value)"></div>
      <div class="field"><label>Prepared by</label><input value="${plan.meta.preparedBy||''}" onchange="update2('meta.preparedBy', this.value)"></div>
    </div>
    <div style="display:flex; gap:32px; align-items:center; flex-wrap:wrap; margin-top:10px;">
      ${pillarWheelSVG()}
      <div style="flex:1; min-width:260px;">
        ${ECS_PILLARS.map(p=>`<div style="margin-bottom:12px;"><div style="font-weight:700; color:var(--navy); font-size:13.5px;">${p.label}</div><div style="font-size:12.5px; color:var(--ink-dim);">${p.desc}</div></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Plan Notes</h2>
    <textarea rows="4" onchange="update2('notes', this.value)">${plan.notes||''}</textarea>
  </div>
  `;
}
function update2(path, val){
  const plan = getPlan(activeId);
  const parts = path.split('.');
  let obj = plan;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = val;
  markDirty();
}

// ==================== PDF REPORT ====================
function buildECSPDF(clientId){
  const sc = getSharedClient(clientId);
  const plan = getPlan(clientId);
  const name = clientName(sc);
  const headers = yearHeaderRow();

  function pdfLineRows(bucket, items, totalsForPct){
    return items.map(it=>{
      const item = plan[bucket][it.key];
      const cells = [];
      for(let y=0;y<=PROJECTION_YEARS;y++){
        const val = projectedValue(item, y);
        const pct = totalsForPct[y] ? (val/totalsForPct[y]*100) : 0;
        cells.push(`<td>${fmt$(val)}<br><span style="color:#999; font-size:9px;">${pct.toFixed(1)}%</span></td>`);
      }
      return `<tr><td>${it.label}</td>${cells.join('')}</tr>`;
    }).join('');
  }
  const assetTotalsByYear = [];
  for(let y=0;y<=PROJECTION_YEARS;y++) assetTotalsByYear.push(yearTotals(plan, y).assets);
  const assetRows = pdfLineRows('assets', ASSET_ITEMS, assetTotalsByYear);
  const liabRows = pdfLineRows('liabilities', LIABILITY_ITEMS, assetTotalsByYear);
  const totalRow = (label, fn) => `<tr style="font-weight:700; border-top:1.5px solid #999;"><td>${label}</td>${headers.map((_,y)=>`<td>${fmt$(fn(y))}</td>`).join('')}</tr>`;

  return `
    <div class="pdf-letterhead">
      <div class="firm">Enterprise Capital Strategy ("ECS")</div>
      <div class="addr">Redmount Capital Partners LLC — 23 Corporate Plaza Drive, Suite 150, Newport Beach, CA 92660</div>
    </div>
    <div class="pdf-title">${esc(name)}</div>
    <div class="pdf-sub">Growth Capitalization · Financial Risks · Liquidity · Capital Allocation</div>
    <div class="pdf-sub">Confidential — Prepared ${plan.meta.asOfDate ? new Date(plan.meta.asOfDate).toLocaleDateString() : new Date().toLocaleDateString()}${plan.meta.preparedBy ? ' by '+esc(plan.meta.preparedBy) : ''}</div>

    <div class="pdf-section" style="text-align:center; margin:20px 0;">
      ${pillarWheelSVG()}
    </div>

    <div class="pdf-page-break">
      <div class="pdf-letterhead">
        <div class="firm">Statement of Current and Projected Balance Sheets</div>
        <div class="addr">${esc(name)}</div>
      </div>
      <div class="pdf-section">
        <h3>Assets</h3>
        <table class="pdf-table">
          <thead><tr><th></th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${assetRows}
            ${totalRow('Total Assets', y=>yearTotals(plan,y).assets)}
          </tbody>
        </table>
      </div>
      <div class="pdf-section">
        <h3>Liabilities</h3>
        <table class="pdf-table">
          <thead><tr><th></th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${liabRows}
            ${totalRow('Total Liabilities', y=>yearTotals(plan,y).liabilities)}
            ${totalRow('Net Worth', y=>yearTotals(plan,y).net)}
          </tbody>
        </table>
      </div>
    </div>

    <div class="pdf-page-break">
      <div class="pdf-letterhead">
        <div class="firm">Cash Trajectory</div>
        <div class="addr">${esc(name)}</div>
      </div>
      <div class="pdf-section">
        <p style="font-size:11.5px; color:var(--ink-dim);">Excess Cash Balances in Business Accounts vs. Cash in Personal Bank Accounts, current through Year ${PROJECTION_YEARS}.</p>
        ${cashTrajectorySVG(plan, 900, 380)}
        <div style="display:flex; gap:18px; margin-top:10px; font-size:11px;">
          <span style="display:flex; align-items:center; gap:6px;"><span style="width:9px; height:9px; background:#9c2b2b; border-radius:2px; display:inline-block;"></span> Excess Cash Balances in Business Accounts</span>
          <span style="display:flex; align-items:center; gap:6px;"><span style="width:9px; height:9px; background:#2f6fed; border-radius:2px; display:inline-block;"></span> Cash in Personal Bank Accounts</span>
        </div>
      </div>
      <div class="pdf-section">
        <h3>Strategy Pillars</h3>
        <div class="pdf-grid two">
          ${ECS_PILLARS.map(p=>`<div class="pdf-field"><div class="l">${esc(p.label)}</div><div class="v">${esc(p.desc)}</div></div>`).join('')}
        </div>
      </div>
      <div class="pdf-section">
        <h3>Methodology</h3>
        <div class="pdf-notes">Projected values compound each line item's current balance at its assigned annual growth rate unless a specific year has been manually overridden (e.g. a planned mortgage payoff, business distribution, or acquisition) — overridden cells reflect the advisor's direct input rather than a formula. This is a planning illustration prepared for discussion purposes and does not constitute investment, tax, or legal advice.</div>
      </div>
      <div class="pdf-sig-row">
        <div class="pdf-sig">Client acknowledges review of this strategy &nbsp;&nbsp;&nbsp;&nbsp; Date</div>
        <div class="pdf-sig">Advisor &nbsp;&nbsp;&nbsp;&nbsp; Date</div>
      </div>
    </div>
  `;
}

function downloadECSPDF(clientId){
  $id('printArea').innerHTML = buildECSPDF(clientId);
  window.print();
}
window.addEventListener('afterprint', ()=>{ const p = $id('printArea'); if(p) p.innerHTML = ''; });

  const toolSwitcher = $id('toolSwitcher');
  if(toolSwitcher) toolSwitcher.addEventListener('change', function(){ if(this.value) window.location.href = this.value; });
  tryAutoLogin();
});
</script>
